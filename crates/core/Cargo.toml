[package]
name = "dedupe_core"
version = "2.9.7"
edition = "2021"

[dependencies]
anyhow = "1"
ahash = "0.8"
hashbrown = "0.14"
indexmap = "2"
epub = "2"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
pdf-extract = "0.7"
tempfile = "3"
thiserror = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "3", default-features = false, features = ["deflate"] }
