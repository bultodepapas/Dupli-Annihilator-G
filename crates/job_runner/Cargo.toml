[package]
name = "dedupe_job_runner"
version = "2.9.11"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "2"
dedupe_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
tempfile = "3"
