name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (example: v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version coherence
        shell: bash
        run: |
          bash scripts/ci/verify-release-consistency.sh "${{ steps.resolve_tag.outputs.tag }}"

      - name: Fetch release tag reference
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.resolve_tag.outputs.tag }}" >/dev/null; then
            git tag -d "${{ steps.resolve_tag.outputs.tag }}"
          fi
          git fetch origin "refs/tags/${{ steps.resolve_tag.outputs.tag }}:refs/tags/${{ steps.resolve_tag.outputs.tag }}"

      - name: Verify release tag comes from origin/main
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        shell: bash
        run: |
          bash scripts/ci/verify-tag-reachable-from-main.sh "${{ steps.resolve_tag.outputs.tag }}"

  build-desktop:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (manual tag)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Checkout (default ref)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tag == '' }}
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Configure updater for release build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
        run: |
          node scripts/release/configure-updater.mjs

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build desktop bundle
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Updater signing key detected. Building signed artifacts."
            cargo tauri build --ci
          else
            echo "No updater signing key configured. Building unsigned artifacts."
            cargo tauri build --ci --no-sign
          fi

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  publish-release:
    needs: [verify-release, build-desktop]
    runs-on: ubuntu-latest
    if: ${{ needs.verify-release.outputs.release_tag != '' }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}

      - name: Resolve release notes file
        id: release_notes
        shell: bash
        run: |
          NOTES_PATH="docs/releases/${{ needs.verify-release.outputs.release_tag }}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "notes_path=docs/releases/TEMPLATE.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Download desktop bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-bundle-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.release_tag }}
          name: Dupli-Annihilator-G ${{ needs.verify-release.outputs.release_tag }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.msi
            release-assets/**/*-setup.exe
            release-assets/**/*.dmg
            release-assets/**/*.app.tar.gz
            release-assets/**/*.app.tar.gz.sig
            release-assets/**/*.sig
            release-assets/**/latest.json
            release-assets/**/latest*.json
