name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (example: v0.1.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version coherence
        shell: bash
        run: |
          bash scripts/ci/verify-release-consistency.sh "${{ steps.resolve_tag.outputs.tag }}"

      - name: Fetch release tag reference
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.resolve_tag.outputs.tag }}" >/dev/null; then
            git tag -d "${{ steps.resolve_tag.outputs.tag }}"
          fi
          git fetch origin "refs/tags/${{ steps.resolve_tag.outputs.tag }}:refs/tags/${{ steps.resolve_tag.outputs.tag }}"

      - name: Verify release tag comes from origin/main
        if: ${{ steps.resolve_tag.outputs.tag != '' }}
        shell: bash
        run: |
          bash scripts/ci/verify-tag-reachable-from-main.sh "${{ steps.resolve_tag.outputs.tag }}"

  build-desktop:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (manual tag)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Checkout (default ref)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.tag == '' }}
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Validate release signing inputs
        if: ${{ needs.verify-release.outputs.release_tag != '' }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" || -z "${TAURI_UPDATER_PUBKEY}" ]]; then
            echo "Tagged releases require TAURI_SIGNING_PRIVATE_KEY and TAURI_UPDATER_PUBKEY." >&2
            exit 1
          fi

          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            if [[ -z "${WINDOWS_CERTIFICATE}" || -z "${WINDOWS_CERTIFICATE_PASSWORD}" || -z "${WINDOWS_CERTIFICATE_THUMBPRINT}" ]]; then
              echo "Windows releases require WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_CERTIFICATE_THUMBPRINT." >&2
              exit 1
            fi
          fi

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            if [[ -z "${APPLE_CERTIFICATE}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_SIGNING_IDENTITY}" || -z "${APPLE_API_ISSUER}" || -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_CONTENT}" || -z "${KEYCHAIN_PASSWORD}" ]]; then
              echo "macOS releases require Apple signing and notarization credentials." >&2
              exit 1
            fi
          fi

      - name: Import Windows code-signing certificate
        if: ${{ runner.os == 'Windows' && needs.verify-release.outputs.release_tag != '' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:WINDOWS_CERTIFICATE_THUMBPRINT }
          if (-not $cert) {
            throw "Imported Windows signing certificate with thumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT was not found."
          }

      - name: Import Apple signing certificate
        if: ${{ runner.os == 'macOS' && needs.verify-release.outputs.release_tag != '' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Write Apple notarization API key
        if: ${{ runner.os == 'macOS' && needs.verify-release.outputs.release_tag != '' }}
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Configure updater for release build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          node scripts/release/configure-updater.mjs

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "2.10.1" --locked

      - name: Build desktop bundle
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          if [[ -n "${{ needs.verify-release.outputs.release_tag }}" ]]; then
            echo "Tagged release detected. Building signed artifacts."
            cargo tauri build --ci
          elif [[ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Updater signing key detected. Building signed artifacts."
            cargo tauri build --ci
          else
            echo "No updater signing key configured. Building unsigned artifacts."
            cargo tauri build --ci --no-sign
          fi

      - name: Verify desktop artifacts
        if: ${{ needs.verify-release.outputs.release_tag != '' || secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          bash scripts/ci/verify-desktop-artifacts.sh "${RUNNER_OS}" "apps/desktop/src-tauri/target/release/bundle"

      - name: Upload desktop bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error

  publish-release:
    needs: [verify-release, build-desktop]
    runs-on: ubuntu-latest
    if: ${{ needs.verify-release.outputs.release_tag != '' }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}

      - name: Resolve release notes file
        id: release_notes
        shell: bash
        run: |
          NOTES_PATH="docs/releases/${{ needs.verify-release.outputs.release_tag }}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "notes_path=docs/releases/TEMPLATE.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Download desktop bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-bundle-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.release_tag }}
          name: Dupli-Annihilator-G ${{ needs.verify-release.outputs.release_tag }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*-setup.exe
            release-assets/**/*.dmg
            release-assets/**/*.app.tar.gz
            release-assets/**/*.app.tar.gz.sig
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.tar.gz
            release-assets/**/*.AppImage.tar.gz.sig
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.sig
            release-assets/**/latest.json
            release-assets/**/latest*.json
